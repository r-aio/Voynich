name: L0-ISM Full Voynich Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Daily automated integrity audit at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-l0-ism:
    name: C99 LUT, Lean 4 Proof, Z3 SMT, DFA Audit & Layer I Falsifier (v2.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Z3 SMT Solver
        run: |
          python -m pip install --upgrade pip
          pip install z3-solver

      - name: Install Lean 4 (via elan)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain stable
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Kernel-Checked Lean 4 Proof (L0ISM_Voynich_Proof.lean)
        run: |
          lean --version | tee lean_proof_report.txt
          echo "--- Running Lean 4 Kernel Checker ---" | tee -a lean_proof_report.txt
          lean L0ISM_Voynich_Proof.lean | tee -a lean_proof_report.txt
          if grep -q "sorryAx" lean_proof_report.txt; then
            echo "[FAIL] Proof depends on sorryAx!"
            exit 1
          fi
          echo "[PASS] Lean 4 kernel verified all L0-ISM theorems with zero sorryAx." | tee -a lean_proof_report.txt

      - name: Compile and Verify C99 Zero-Heap LUT (voynich_l0_lut.h)
        run: |
          cat << 'EOF' > test_c99_lut.c
          #include <stdio.h>
          #include <assert.h>
          #include "voynich_l0_lut.h"

          int main(void) {
              VoynichLUT_Entry_t e1 = voynich_decode_frame("qokaiin");
              assert(e1.target_node == NODE_PRIMARY_COOLING);
              assert(e1.state_delta == +2);
              assert(e1.valve_position_pct == 22);

              VoynichLUT_Entry_t e2 = voynich_decode_frame("qotaiiin");
              assert(e2.target_node == NODE_HYPOCAUST_3WAY_VALVE);
              assert(e2.state_delta == +3);

              VoynichLUT_Entry_t e3 = voynich_decode_frame("ckhaiin");
              assert(e3.target_node == NODE_THERMAL_EXP_BELLOWS);
              assert(e3.state_delta == 0);

              VoynichLUT_Entry_t e4 = voynich_decode_frame("qokaiiii");
              assert(e4.state_delta == L0_HARD_STOP_CODE);

              VoynichLUT_Entry_t e_unk = voynich_decode_frame("non_existent_token");
              assert(e_unk.state_delta == L0_HARD_STOP_CODE);

              printf("[PASS] C99 Zero-Heap O(1) LUT compiled and verified successfully.\n");
              return 0;
          }
          EOF
          gcc -std=c99 -Wall -Wextra -Werror -O2 test_c99_lut.c -o test_c99_lut
          ./test_c99_lut

      - name: Execute Layer II Audit, Negative Controls & Z3 SMT Proofs
        run: |
          python voynich_ivtff_auditor.py ZL3b-n.txt RF1b-e.txt > audit_report.txt
          cat audit_report.txt

      - name: Execute Layer I Falsification Suite (v2.1)
        run: |
          python voynich_layer1_falsifier.py ZL3b-n.txt RF1b-e.txt > layer1_falsification_report.txt
          cat layer1_falsification_report.txt

      - name: Publish Reports to GitHub Step Summary
        if: always()
        run: |
          echo "## Lean 4 Kernel-Checked Proof Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat lean_proof_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## L0-ISM v2.1 Layer I Falsification Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat layer1_falsification_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## L0-ISM Layer II Verification Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat audit_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l0-ism-voynich-audit-report-v2.1
          path: |
            audit_report.txt
            lean_proof_report.txt
            layer1_falsification_report.txt
          retention-days: 90
