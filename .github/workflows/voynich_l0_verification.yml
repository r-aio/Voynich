name: L0-ISM Full Voynich Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-l0-ism:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Z3 SMT Solver
        run: |
          python -m pip install --upgrade pip
          pip install z3-solver

      - name: Verify Zero-Heap C99 Header (voynich_l0_lut.h)
        run: |
          cat << 'EOF' > test_lut_compile.c
          #include "voynich_l0_lut.h"
          int main(void) {
              return 0;
          }
          EOF
          gcc -std=c99 -Wall -Wextra -pedantic test_lut_compile.c -o test_lut_compile
          ./test_lut_compile
          echo "C99 Zero-Heap header compiled cleanly with GCC (-std=c99 -Wall -Wextra -pedantic)."

      - name: Run Full IVTFF 2.0 Audit (ZL3b-n.txt & RF1b-e.txt) + Z3 Proof
        run: |
          python voynich_ivtff_auditor.py ZL3b-n.txt RF1b-e.txt | tee audit_report.txt

      - name: Publish Report to GitHub Job Summary
        run: |
          echo "## L0-ISM Full Voynich Verification Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat audit_report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
