name: Pure Voynich Corpus Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Daily pure corpus check at 06:30 UTC
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-pure-corpus:
    name: Pure Corpus Audit, Probes, Dissector, Generators, h2 & v3.2 Head-to-Head
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Pure Corpus Audit
        run: |
          if [ -f voynich_pure_corpus_audit.py ]; then
            python voynich_pure_corpus_audit.py ZL3b-n.txt RF1b-e.txt > pure_corpus_audit_report.txt
            cat pure_corpus_audit_report.txt
          else
            echo "[INFO] voynich_pure_corpus_audit.py not present; skipping." > pure_corpus_audit_report.txt
          fi

      - name: Execute Cryptographic & Verbose-Cipher Probes
        run: |
          if [ -f voynich_cipher_probes.py ]; then
            python voynich_cipher_probes.py ZL3b-n.txt > cipher_probes_report.txt
            cat cipher_probes_report.txt
          else
            echo "[INFO] voynich_cipher_probes.py not present; skipping." > cipher_probes_report.txt
          fi

      - name: Execute Deep Structural & Mechanism Probes
        run: |
          if [ -f voynich_deep_probes.py ]; then
            python voynich_deep_probes.py ZL3b-n.txt > deep_probes_report.txt
            cat deep_probes_report.txt
          else
            echo "[INFO] voynich_deep_probes.py not present; skipping." > deep_probes_report.txt
          fi

      - name: Execute Surgical Anomaly Dissector
        run: |
          if [ -f voynich_anomaly_dissector.py ]; then
            python voynich_anomaly_dissector.py ZL3b-n.txt RF1b-e.txt > anomaly_dissector_report.txt
            cat anomaly_dissector_report.txt
          else
            echo "[INFO] voynich_anomaly_dissector.py not present; skipping." > anomaly_dissector_report.txt
          fi

      - name: Execute Generator Comparison Benchmark
        run: |
          if [ -f voynich_generator_comparison.py ]; then
            python voynich_generator_comparison.py > generator_comparison_report.txt
            cat generator_comparison_report.txt
          else
            echo "[INFO] voynich_generator_comparison.py not present; skipping." > generator_comparison_report.txt
          fi

      - name: Execute Closing Tests (Hybrid 2D, Length Conditioning & Gallows)
        run: |
          if [ -f voynich_closing_tests.py ]; then
            python voynich_closing_tests.py ZL3b-n.txt > closing_tests_report.txt
            cat closing_tests_report.txt
          else
            echo "[INFO] voynich_closing_tests.py not present; skipping." > closing_tests_report.txt
          fi

      - name: Execute h2 & Empty-Corner Benchmark (v3.1)
        run: |
          if [ -f voynich_h2_empty_corner.py ]; then
            python voynich_h2_empty_corner.py ZL3b-n.txt > h2_empty_corner_report.txt
            cat h2_empty_corner_report.txt
          else
            echo "[INFO] voynich_h2_empty_corner.py not present; skipping." > h2_empty_corner_report.txt
          fi

      - name: Execute v3.2 Head-to-Head Benchmark (Held-Out vs. Workshop/Naibbe & Tachygraphy)
        run: |
          if [ -f voynich_v32_head_to_head.py ]; then
            python voynich_v32_head_to_head.py ZL3b-n.txt > v32_head_to_head_report.txt
            cat v32_head_to_head_report.txt
          else
            echo "[INFO] voynich_v32_head_to_head.py not present; skipping." > v32_head_to_head_report.txt
          fi

      - name: Publish Reports to GitHub Step Summary
        if: always()
        run: |
          if [ -f v32_head_to_head_report.txt ]; then
            echo "## Voynich v3.2 — Held-Out Hybrids vs. Verbose Workshop & Tachygraphy" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat v32_head_to_head_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f h2_empty_corner_report.txt ]; then
            echo "## Voynich v3.1 — Conditional Entropy (h2) & Empty-Corner Benchmark" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat h2_empty_corner_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f closing_tests_report.txt ]; then
            echo "## Voynich Closing Tests (Hybrid 2D, Length Conditioning & Gallows)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat closing_tests_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f generator_comparison_report.txt ]; then
            echo "## Voynich Generator Comparison Benchmark" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat generator_comparison_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f anomaly_dissector_report.txt ]; then
            echo "## Voynich Surgical Anomaly Dissector" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat anomaly_dissector_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f deep_probes_report.txt ]; then
            echo "## Voynich Deep Structural & Mechanism Probes" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat deep_probes_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f cipher_probes_report.txt ]; then
            echo "## Voynich Cryptographic & Verbose-Cipher Probes" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat cipher_probes_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f pure_corpus_audit_report.txt ]; then
            echo "## Pure Voynich Corpus Audit Report" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat pure_corpus_audit_report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Pure Corpus Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voynich-pure-corpus-audit-report-v3.2
          path: |
            pure_corpus_audit_report.txt
            cipher_probes_report.txt
            deep_probes_report.txt
            anomaly_dissector_report.txt
            generator_comparison_report.txt
            closing_tests_report.txt
            h2_empty_corner_report.txt
            v32_head_to_head_report.txt
          if-no-files-found: warn
          retention-days: 90
